name: Android APK

# Every push builds debug-signed release APKs. Pushes to main publish them
# as the rolling "Latest build" pre-release; tags like v1.2.3 publish a
# normal release. Telegram API credentials come from repository secrets.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  # Builds of main always finish so every push gets a release.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.8'

jobs:
  # liblumina_calls.so, built only when its inputs change (see calls-engine.yml).
  engine:
    uses: ./.github/workflows/calls-engine.yml

  build:
    needs: engine
    # A failed engine build still produces an APK (calls then say they're
    # unavailable); the step below warns.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # The build (TDLib, ffmpeg, VLC, llama.cpp, models) needs ~20 GB.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/lib/node_modules
          sudo docker image prune --all --force || true
          df -h /

      - uses: actions/checkout@v4

      # Models live in Git LFS; GitHub's free LFS bandwidth is 1 GB/month,
      # so fetch them once and cache by object id.
      - name: List LFS objects
        run: git lfs ls-files --long | cut -d' ' -f1 | sort > .lfs-ids
      - name: Restore LFS cache
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-ids') }}
      - name: Fetch LFS objects
        run: git lfs pull

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: gradle-

      - name: Calls engine
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ needs.engine.outputs.key }}
        run: |
          if [ -n "$KEY" ] && gh release download "calls-engine-$KEY" -p 'liblumina_calls-*.so' -D engine; then
            for abi in arm64-v8a x86_64; do
              mkdir -p "android/app/src/main/jniLibs/$abi"
              mv "engine/liblumina_calls-$abi.so" "android/app/src/main/jniLibs/$abi/liblumina_calls.so"
            done
            ls -l android/app/src/main/jniLibs/*/liblumina_calls.so
          else
            echo "::warning::Calls engine $KEY is not available; this APK has no calls"
          fi

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # A stable debug key keeps APKs from different runs installable over
      # each other. Store one as the DEBUG_KEYSTORE_B64 secret (see
      # docs/AGENT_HANDOFF.md §4); without it the runner's fresh key is used.
      - name: Install debug keystore
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            echo "$DEBUG_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "Using the repository's debug keystore"
          else
            echo "::warning::DEBUG_KEYSTORE_B64 is not set; APKs are signed with a throwaway debug key"
          fi

      - name: Build APKs
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          if [ -z "$TG_API_ID" ] || [ -z "$TG_API_HASH" ]; then
            echo "::warning::TG_API_ID / TG_API_HASH secrets are not set; the app will build but cannot sign in"
          fi
          flutter build apk --release --split-per-abi \
            --target-platform android-arm64,android-x64 \
            --build-number=${{ github.run_number }} \
            --dart-define=TG_API_ID=${TG_API_ID:-0} \
            --dart-define=TG_API_HASH=${TG_API_HASH:-}
          cd build/app/outputs/flutter-apk
          for f in app-*-release.apk; do mv "$f" "lumina-${f#app-}"; done
          sha256sum lumina-*.apk > SHA256SUMS.txt
          ls -lh

      - name: Check 16 KB page alignment
        run: python3 -I tool/check_16kb.py build/app/outputs/flutter-apk/lumina-arm64-v8a-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: lumina-apk-${{ github.run_number }}
          path: |
            build/app/outputs/flutter-apk/lumina-*.apk
            build/app/outputs/flutter-apk/SHA256SUMS.txt
          retention-days: 14

      - name: Publish "Latest build" pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-build --yes --cleanup-tag || true
          gh release create latest-build \
            --prerelease --target "$GITHUB_SHA" \
            --title "Latest build (#${{ github.run_number }})" \
            --notes "Debug-signed build of ${GITHUB_SHA::7}. Not for the Play Store." \
            build/app/outputs/flutter-apk/lumina-*.apk build/app/outputs/flutter-apk/SHA256SUMS.txt

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes \
            --title "Lumina $GITHUB_REF_NAME" \
            build/app/outputs/flutter-apk/lumina-*.apk build/app/outputs/flutter-apk/SHA256SUMS.txt
